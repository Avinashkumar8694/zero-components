<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Application Standard Variables - Synchronized with Orchestrator */
            --bg-color: var(--uiv-app-bg, #0f172a);
            --sidebar-bg: var(--uiv-app-sidebar-bg, rgba(30, 41, 59, 0.7));
            --header-bg: var(--uiv-app-header-bg, rgba(15, 23, 42, 0.8));
            --card-bg: var(--uiv-app-card-bg, rgba(30, 41, 59, 0.5));
            --text-color: var(--uiv-app-text-color, #f1f5f9);
            --text-muted: var(--uiv-app-text-muted, #94a3b8);
            --accent-color: var(--uiv-app-accent-color, #38bdf8);
            --border-color: var(--uiv-app-border-color, rgba(51, 65, 85, 0.5));
            --sidebar-text: var(--uiv-app-sidebar-text, #f1f5f9);
            --glass-blur: var(--uiv-app-glass-blur, blur(12px));
            --transition: all 0.4s ease;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-color);
            margin: 0;
            font-weight: 600;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--sidebar-text);
        }

        .logo i {
            color: var(--accent-color);
        }

        .nav-section {
            padding: 1.5rem 0.5rem;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--sidebar-text);
            opacity: 0.5;
            padding: 0 1.25rem;
            margin-bottom: 12px;
            margin-top: 2rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.25rem;
            text-decoration: none;
            color: var(--sidebar-text);
            border-radius: 8px;
            margin-bottom: 0.25rem;
            transition: var(--transition);
            font-size: 0.9375rem;
        }

        .nav-item:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
        }

        .nav-item.active {
            background: var(--accent-color);
            color: #0f172a;
        }

        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.05), transparent);
        }

        .top-bar {
            height: 70px;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-color);
        }

        .content-area {
            padding: 2rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        .tabs {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 1rem 0.5rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
            color: var(--text-muted);
            font-weight: 500;
        }

        .tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .component-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .component-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            background: rgba(30, 41, 59, 0.8);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent-color);
            color: #0f172a;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-layer-group"></i>
                <span>Zero Core</span>
            </div>
        </div>
        
        <nav class="nav-section">
            <div class="nav-label">Global</div>
            <a href="index.html" class="nav-item"><i class="fas fa-th-large"></i> Explore</a>
            <a href="marketplace.html" class="nav-item active"><i class="fas fa-shopping-bag"></i> Marketplace</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Settings</a>
        </nav>
    </aside>

    <div class="main-container">
        <header class="top-bar">
            <div>
                <h2 style="margin: 0; font-size: 1.25rem;">Marketplace</h2>
            </div>
            <p style="color: var(--text-muted); font-size: 0.875rem; margin: 0;">Discover & install plugins</p>
        </header>

        <main class="content-area">
            <div class="tabs">
                <div id="compTab" class="tab active" onclick="switchTab('components')">Components</div>
                <div id="themeTab" class="tab" onclick="switchTab('themes')">Themes</div>
            </div>

            <div id="marketGrid" class="market-grid">
                <!-- populated by JS -->
            </div>
        </main>
    </div>

    <script type="module" src="/packages/register-plugins/index.js"></script>
    <script type="module" src="/packages/zero-theme-orchestrator/src/index.ts"></script>
    <script type="module" src="/packages/zero-uiv-themes/src/index.ts"></script>
    <script type="module">
        import './bridge.ts';
        import './index.ts';

        let activeTab = 'components';
        let discovery = { components: [], themes: [] };

        async function fetchDiscovery() {
            try {
                const res = await fetch('http://localhost:5555/service/discovery');
                discovery = await res.json();
                renderMarket();
            } catch (e) { console.error('Discovery failed', e); }
        }


        function renderMarket() {
            const grid = document.getElementById('marketGrid');
            grid.innerHTML = '';

            const items = activeTab === 'components' ? (discovery.components || []) : (discovery.themes || []);
            
            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 4rem;">Finding available plugins...</div>';
                return;
            }

            grid.innerHTML = items.map(item => {
                const isInstalled = window.isPluginInstalled(item.id);
                // Discovery typically has id and name. name is the full name.
                const displayName = item.name || item.id;
                const displaySelector = item.selector || item.id;
                
                return `
                    <div class="component-card">
                        <div style="font-size: 2rem; color: var(--accent-color); margin-bottom: 1rem;">
                            <i class="fas ${activeTab === 'components' ? 'fa-puzzle-piece' : 'fa-palette'}"></i>
                        </div>
                        <h3 style="margin: 0; font-size: 1.1rem;">${displayName}</h3>
                        <div style="color: var(--text-muted); font-size: 0.75rem; font-family: monospace; margin-top: 0.25rem;">${displaySelector}</div>
                        <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.75rem;">${item.desc || (activeTab === 'components' ? 'Unified Lit plugin ready for installation.' : 'Official theme provider for Zero Components.')}</p>
                        <div style="display: flex; gap: 1rem; margin-top: auto;">
                            ${isInstalled 
                                ? `<button class="btn btn-secondary" style="flex: 1; background: var(--uiv-app-accent-transparent, rgba(255, 71, 87, 0.1)); color: var(--uiv-status-danger, #ff4757); border: 1px solid var(--uiv-status-danger, rgba(255, 71, 87, 0.2));" onclick="event.stopPropagation(); window.removePlugin('${item.id}')">Remove</button>` 
                                : `<button class="btn btn-primary" style="flex: 1;" onclick="event.stopPropagation(); window.addPlugin('${item.id}')">Add to Project</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.addPlugin = async (id) => {
            if (!window.isPluginInstalled(id)) {
                window.installPlugin(id);
                const plugin = [...discovery.components, ...discovery.themes].find(p => p.id === id);
                await window.loadPlugin(id, plugin?.main);
                renderMarket();
            }
        };

        window.removePlugin = (id) => {
            if (window.isPluginInstalled(id)) {
                window.uninstallPlugin(id);
                renderMarket();
            }
        };

        window.switchTab = (tab) => {
            activeTab = tab;
            document.getElementById('compTab').classList.toggle('active', tab === 'components');
            document.getElementById('themeTab').classList.toggle('active', tab === 'themes');
            renderMarket();
        };

        fetchDiscovery();
    </script>
</body>
</html>
