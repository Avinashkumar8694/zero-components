<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: var(--uiv-app-bg, #0f172a);
            --sidebar-bg: var(--uiv-app-sidebar-bg, rgba(30, 41, 59, 0.7));
            --sidebar-text: var(--uiv-app-sidebar-text, var(--uiv-app-text-color, #f1f5f9));
            --card-bg: var(--uiv-app-card-bg, rgba(30, 41, 59, 0.5));
            --text-color: var(--uiv-app-text-color, #f1f5f9);
            --text-muted: var(--uiv-app-text-muted, #94a3b8);
            --accent-color: var(--uiv-app-accent-color, #38bdf8);
            --border-color: var(--uiv-app-border-color, rgba(51, 65, 85, 0.5));
            --glass-blur: var(--uiv-app-glass-blur, blur(12px));
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--sidebar-text);
        }

        .logo i {
            color: var(--accent-color);
        }

        .nav-section {
            padding: 1.5rem 0.5rem;
        }

        .nav-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--sidebar-text);
            opacity: 0.5;
            padding: 0 1.25rem;
            margin-bottom: 12px;
            margin-top: 2rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.25rem;
            text-decoration: none;
            color: var(--sidebar-text);
            border-radius: 8px;
            margin-bottom: 0.25rem;
            transition: var(--transition);
        }

        .nav-item:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
        }

        .nav-item.active {
            background: var(--uiv-app-accent-transparent, rgba(56, 189, 248, 0.1));
            color: var(--accent-color);
            font-weight: 600;
        }

        .main-content {
            flex-grow: 1;
            padding: 3rem;
            overflow-y: auto;
        }

        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            /* max-width: 800px; */
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.75rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        select,
        input {
            width: 100%;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .theme-option {
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        .theme-option:hover {
            border-color: var(--accent-color);
        }

        .theme-option.active {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div style="padding: 2rem; border-bottom: 1px solid var(--border-color);">
            <div class="logo">
                <i class="fas fa-layer-group"></i> <span>Zero Core</span>
            </div>
        </div>
        <nav class="nav-section">
            <a href="index.html" class="nav-item"><i class="fas fa-th-large"></i> Explore</a>
            <a href="marketplace.html" class="nav-item"><i class="fas fa-shopping-bag"></i> Marketplace</a>
            <a href="settings.html" class="nav-item active"><i class="fas fa-sliders-h"></i> Settings</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>Global Settings</h1>
        <p style="color: var(--text-muted); margin-bottom: 3rem;">Configure your global theme orchestrator and provider
            preferences.</p>

        <div class="settings-card">
            <h3>Environment</h3>
            <div class="form-group"
                style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
                <div>
                    <label class="form-label" style="display:inline-block; margin-bottom:0">Live Developer Mode</label>
                    <p style="color: var(--text-muted); font-size: 0.8rem; margin: 0.25rem 0 0 0;">Load component source
                        files directly for testing.</p>
                </div>
                <label style="position: relative; display: inline-block; width: 50px; height: 28px;">
                    <input type="checkbox" id="devModeToggle" onchange="toggleDevMode()"
                        style="opacity: 0; width: 0; height: 0;">
                    <span
                        style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--uiv-app-text-muted, #ccc); transition: .4s; border-radius: 34px;"
                        id="devModeSlider"></span>
                </label>
            </div>
            <div class="form-group"
                style="display: flex; align-items: center; justify-content: space-between; margin: 0;">
                <div>
                    <label class="form-label" style="display:inline-block; margin-bottom:0">Global Theme Sync</label>
                    <p style="color: var(--text-muted); font-size: 0.8rem; margin: 0.25rem 0 0 0;">Force all providers
                        to follow the Primary provider's selection.</p>
                </div>
                <label style="position: relative; display: inline-block; width: 50px; height: 28px;">
                    <input type="checkbox" id="syncModeToggle" onchange="toggleSyncMode()"
                        style="opacity: 0; width: 0; height: 0;">
                    <span
                        style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--uiv-app-text-muted, #ccc); transition: .4s; border-radius: 34px;"
                        id="syncModeSlider"></span>
                </label>
            </div>
        </div>

        <div id="providersSettings">
            <!-- Dynamically generated per provider -->
        </div>
    </main>

    <script type="module" src="/packages/register-plugins/index.js"></script>
    <script type="module" src="/packages/zero-theme-orchestrator/src/index.ts"></script>
    <script type="module" src="/packages/zero-uiv-themes/src/index.ts"></script>
    <script type="module" src="/packages/zero-standard-themes/src/index.ts"></script>
    <script type="module" src="./index.ts"></script>
    <script>
        function toggleDevMode() {
            const isDev = document.getElementById('devModeToggle').checked;
            localStorage.setItem('zero-env-mode', isDev ? 'dev' : 'prod');
            alert('Environment changed! Reloading dashboard...');
            window.location.reload();
        }

        function toggleSyncMode() {
            const isSync = document.getElementById('syncModeToggle').checked;
            if (window.zeroThemeManager) {
                window.zeroThemeManager.setFollowPrimary(isSync);
                renderSettings();
                updateSettingsTheme();
            }
        }

        // Theme Status Sync & Global Variable Injection
        const updateSettingsTheme = () => {
            const manager = window.zeroThemeManager;
            if (!manager) return;

            let styleTag = document.getElementById('zero-theme-overrides');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'zero-theme-overrides';
                document.head.appendChild(styleTag);
            }

            styleTag.innerHTML = `
                :root {
                    --bg-color: var(--uiv-app-bg, #0f172a);
                    --sidebar-bg: var(--uiv-app-sidebar-bg, rgba(30, 41, 59, 0.7));
                    --sidebar-text: var(--uiv-app-sidebar-text, var(--uiv-app-text-color, #f1f5f9));
                    --header-bg: var(--uiv-app-header-bg, rgba(15, 23, 42, 0.8));
                    --card-bg: var(--uiv-app-card-bg, rgba(30, 41, 59, 0.5));
                    --text-color: var(--uiv-app-text-color, #f1f5f9);
                    --text-muted: var(--uiv-app-text-muted, #94a3b8);
                    --accent-color: var(--uiv-app-accent-color, #38bdf8);
                    --border-color: var(--uiv-app-border-color, rgba(51, 65, 85, 0.5));
                    --glass-blur: var(--uiv-app-glass-blur, blur(12px));
                }
                
                .settings-card {
                    backdrop-filter: var(--glass-blur);
                    box-shadow: var(--uiv-shadow-depth, 0 4px 6px -1px rgba(0,0,0,0.1));
                    transition: all 0.5s ease;
                    position: relative;
                }

                .theme-option.active {
                    background: var(--uiv-app-accent-transparent, rgba(56, 189, 248, 0.1));
                    color: var(--accent-color);
                    border-color: var(--accent-color);
                    box-shadow: 0 0 15px var(--uiv-app-accent-transparent);
                }
            `;
        };

        function renderSettings() {
            updateSettingsTheme();
            const isDev = localStorage.getItem('zero-env-mode') === 'dev';
            const devToggle = document.getElementById('devModeToggle');
            if (devToggle) devToggle.checked = isDev;
            const devSlider = document.getElementById('devModeSlider');
            if (devSlider) devSlider.style.backgroundColor = isDev ? 'var(--accent-color)' : '#ccc';
            if (devSlider) devSlider.style.backgroundColor = isDev ? 'var(--accent-color)' : 'var(--border-color)';

            const manager = window.zeroThemeManager;
            const providersSettings = document.getElementById('providersSettings');
            if (!manager) {
                if (providersSettings) providersSettings.innerHTML = '<div class="settings-card"><p style="color:var(--text-muted)">Waiting for Theme Orchestrator...</p></div>';
                setTimeout(renderSettings, 100);
                return;
            }

            const isSync = manager.getFollowPrimary?.() || false;
            const syncToggle = document.getElementById('syncModeToggle');
            if (syncToggle) syncToggle.checked = isSync;
            const syncSlider = document.getElementById('syncModeSlider');
            if (syncSlider) syncSlider.style.backgroundColor = isSync ? 'var(--accent-color)' : 'var(--border-color)';

            const providers = manager.getProviders();
            if (!providersSettings) return;

            if (providers.length === 0) {
                providersSettings.innerHTML = `
                    <div class="settings-card" style="text-align: center;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
                        <h3>No Theme Providers Found</h3>
                        <p style="color: var(--text-muted);">Please wait for providers to register or <a href="#" onclick="renderSettings()" style="color: var(--accent-color)">click here to refresh</a>.</p>
                    </div>
                `;
                return;
            }

            const rootPID = manager.getRootProviderId?.() || 'zero-uiv-themes';

            providersSettings.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2 style="margin: 0;">Theme Sources</h2>
                    <button onclick="renderSettings()" class="nav-item" style="margin: 0; padding: 0.5rem 1rem; cursor: pointer; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            ` + providers.map(p => {
                const themes = p.getThemeNames();
                const activeTheme = manager.getActiveThemeName(p.id);
                const isRoot = p.id === rootPID;

                return `
                    <div class="settings-card" style="${isRoot ? 'border-color: var(--accent-color);' : ''}">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
                            <div style="display: flex; align-items: center; gap: 1rem;">
                                <i class="fas ${p.id.includes('uiv') ? 'fa-magic' : 'fa-palette'}" style="color: ${isRoot ? 'var(--accent-color)' : 'var(--text-muted)'}; font-size: 1.25rem;"></i>
                                <h3 style="margin: 0;">${p.name}</h3>
                                ${isRoot ? '<span style="background: var(--accent-color); color: var(--uiv-text-inverse, #0f172a); font-size: 0.6rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; text-transform: uppercase;">Primary</span>' : ''}
                            </div>
                            <button onclick="window.zeroThemeManager.setRootProvider('${p.id}'); renderSettings();" 
                                    style="background: ${isRoot ? 'rgba(56, 189, 248, 0.2)' : 'transparent'}; border: 1px solid ${isRoot ? 'var(--accent-color)' : 'rgba(255,255,255,0.1)'}; color: ${isRoot ? 'var(--accent-color)' : 'var(--text-muted)'}; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem;">
                                ${isRoot ? 'Structural Control Active' : 'Set as Primary'}
                            </button>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Active Theme: ${activeTheme}</label>
                            <div class="theme-grid">
                                ${themes.map(t => `
                                    <div class="theme-option ${t === activeTheme ? 'active' : ''}" 
                                         onclick="window.zeroThemeManager.setActiveTheme('${t}', '${p.id}'); renderSettings();">
                                        <i class="fas ${getThemeIcon(t)}" style="display: block; font-size: 1.5rem; margin-bottom: 0.5rem;"></i>
                                        ${t.charAt(0).toUpperCase() + t.slice(1)}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getThemeIcon(name) {
            const icons = {
                modern: 'fa-rocket',
                cyber: 'fa-terminal',
                glass: 'fa-square',
                retro: 'fa-gamepad',
                neon: 'fa-bolt',
                corporate: 'fa-briefcase',
                wealth: 'fa-coins',
                nature: 'fa-leaf',
                light: 'fa-sun',
                dark: 'fa-moon'
            };
            return icons[name] || 'fa-palette';
        }

        window.addEventListener('library-ready', renderSettings);
        window.addEventListener('DOMContentLoaded', () => {
            renderSettings();
            // Listen for structural changes in themes/providers
            if (window.zeroThemeManager) {
                window.zeroThemeManager.addEventListener('providers-changed', renderSettings);
                window.zeroThemeManager.addEventListener('theme-changed', () => {
                    renderSettings();
                    updateSettingsTheme();
                });
            } else {
                // Fallback for extreme late-binding
                window.addEventListener('zero-orchestrator-ready', () => {
                    window.zeroThemeManager.addEventListener('providers-changed', renderSettings);
                    window.zeroThemeManager.addEventListener('theme-changed', () => {
                        renderSettings();
                        updateSettingsTheme();
                    });
                    renderSettings();
                });
            }
        });
    </script>
</body>

</html>
