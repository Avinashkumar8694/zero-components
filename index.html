<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Component Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Application Standard Variables with Advanced Semantic Mapping */
            --bg-color: var(--uiv-app-bg, #0f172a);
            --sidebar-bg: var(--uiv-app-sidebar-bg, rgba(30, 41, 59, 0.7));
            --header-bg: var(--uiv-app-header-bg, rgba(15, 23, 42, 0.8));
            --card-bg: var(--uiv-app-card-bg, rgba(30, 41, 59, 0.5));
            --text-color: var(--uiv-app-text-color, #f1f5f9);
            --text-muted: var(--uiv-app-text-muted, #94a3b8);
            --accent-color: var(--uiv-app-accent-color, #38bdf8);
            --border-color: var(--uiv-app-border-color, rgba(51, 65, 85, 0.5));
            --glass-blur: var(--uiv-app-glass-blur, blur(12px));
            --sidebar-text: var(--uiv-app-sidebar-text, #f1f5f9);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-color);
            margin: 0;
            font-weight: 600;
        }

        body {
            background-color: var(--uiv-app-bg);
            color: var(--uiv-text-primary);
            font-family: var(--uiv-font-family, 'Outfit', 'Inter', -apple-system, sans-serif);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr 340px;
            height: 100%;
            background-color: var(--uiv-bg-primary);
        }

        /* Sidebar Styles */
        .sidebar {
            background-color: var(--uiv-app-sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
            position: relative;
            z-index: 10;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .sidebar-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--sidebar-text);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--sidebar-text);
        }

        .logo i {
            color: var(--accent-color);
        }

        .sidebar-section {
            margin-bottom: 32px;
        }

        .sidebar-section h3 {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--sidebar-text);
            opacity: 0.7;
            margin-bottom: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.25rem;
            text-decoration: none;
            color: var(--sidebar-text);
            border-radius: 8px;
            margin: 0.25rem 0.5rem;
            transition: var(--transition);
            font-size: 0.9375rem;
            width: auto;
        }

        .nav-item:hover {
            background: var(--uiv-app-accent-transparent, rgba(56, 189, 248, 0.1));
            color: var(--accent-color);
        }

        .nav-item.active {
            background: var(--uiv-app-accent-transparent, rgba(56, 189, 248, 0.1));
            color: var(--accent-color);
            font-weight: 600;
        }

        .nav-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--sidebar-text);
            opacity: 0.5;
            padding: 0 1.25rem;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: var(--accent-color);
            color: var(--uiv-text-inverse, #ffffff);
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--uiv-app-accent-transparent, rgba(56, 189, 248, 0.2));
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--uiv-app-accent-transparent, rgba(56, 189, 248, 0.3));
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Main Content */
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at top right, var(--uiv-app-accent-transparent, rgba(56, 189, 248, 0.05)), transparent);
        }

        .top-bar {
            height: 70px;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-color);
        }

        .content-area {
            padding: 2rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Grid of Components */
        .component-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .component-card {
            background: var(--card-bg, rgba(30, 41, 59, 0.4));
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: var(--glass-blur);
            box-shadow: var(--uiv-shadow-depth, 0 8px 32px 0 rgba(0, 0, 0, 0.3));
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
            cursor: pointer;
        }

        .component-card::before {
            content: '';
        }

        .component-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            background: var(--uiv-app-sidebar-bg, rgba(30, 41, 59, 0.8));
        }

        .preview-pane {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .controls-pane {
            display: none;
            /* Removed from main layout, moved to sidebar */
        }

        .setting-group {
            margin-bottom: 2rem;
        }

        .setting-label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: var(--uiv-app-input-bg, rgba(15, 23, 42, 0.5));
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-color);
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .theme-pill {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8125rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>

<body>
    <!-- Navigation Sidebar -->
    <aside class="sidebar">
        <div id="globalNav">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-layer-group"></i>
                    <span>Zero Core</span>
                </div>
            </div>

            <nav class="nav-section">
                <div class="nav-label">Global</div>
                <a href="index.html" class="nav-item active"><i class="fas fa-th-large"></i> Explore</a>
                <a href="#" class="nav-item" onclick="showPlayground()"><i class="fas fa-vial"></i> Playground</a>
                <a href="marketplace.html" class="nav-item"><i class="fas fa-shopping-bag"></i> Marketplace</a>
                <a href="settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Settings</a>

                <div class="nav-label" style="margin-top: 2rem;">Quick Components</div>
                <div id="quickNavList">
                    <!-- populated by JS -->
                </div>
            </nav>
        </div>

        <div id="componentNav" style="display: none; flex-direction: column; height: 100%;">
            <div class="sidebar-header" style="display: flex; align-items: center; gap: 1rem; padding: 1.5rem;">
                <button onclick="showExplore()"
                    style="background: var(--uiv-app-accent-transparent, rgba(56, 189, 248, 0.1)); border: 1px solid var(--border-color); color: var(--accent-color); cursor: pointer; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; display: flex; align-items: center; gap: 0.5rem; width: 100%;">
                    <i class="fas fa-arrow-left"></i> Back to Explorer
                </button>
            </div>
            <div class="nav-section" style="padding-top: 0;">
                <div id="settingsSection">
                    <div class="nav-label">Component Settings</div>
                    <div id="sidenav-list" style="padding: 0 0.5rem;"></div>
                </div>
                <div id="eventLogSection"
                    style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
                    <div class="nav-label" style="display: flex; justify-content: space-between; align-items: center;">
                        Event Log
                        <button onclick="window.clearEventLog()"
                            style="background: none; border: none; color: var(--accent-color); cursor: pointer; font-size: 0.7rem; padding: 0;">Clear</button>
                    </div>
                    <div id="event-log"
                        style="margin: 0.5rem; height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; background: var(--uiv-app-accent-transparent, rgba(15, 23, 42, 0.3)); border-radius: 8px; padding: 0.75rem; color: var(--uiv-app-text-muted, #94a3b8); line-height: 1.4;">
                        <div style="color: var(--text-muted)">Waiting for events...</div>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <div class="main-container">
        <!-- Top Bar -->
        <header class="top-bar">
            <div>
                <h2 id="pageTitle" style="margin: 0; font-size: 1.25rem;">Component Explorer</h2>
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="theme-pill" title="UIV Components Theme">
                    <i class="fas fa-magic"></i>
                    <span style="font-size: 0.7rem; color: var(--text-muted); margin-right: 0.25rem;">UIV:</span>
                    <span id="uivThemeName">modern</span>
                </div>
                <div class="theme-pill" title="Standard Components Theme">
                    <i class="fas fa-palette"></i>
                    <span style="font-size: 0.7rem; color: var(--text-muted); margin-right: 0.25rem;">STD:</span>
                    <span id="standardThemeName">modern</span>
                </div>
            </div>
        </header>

        <!-- Dynamic Content -->
        <main class="content-area">
            <div id="exploreView" class="component-grid">
                <!-- Default Grid View -->
            </div>

            <div id="previewView" style="display: none;">
                <div
                    style="width: 100%; height: calc(100vh - 150px); display: flex; align-items: center; justify-content: center;">
                    <div class="preview-pane" id="mainPreview" style="width: 100%; max-width: 1200px; height: 100%;">
                        <!-- Component rendered here -->
                    </div>
                </div>
            </div>

            <div id="playgroundView" style="display: none; height: calc(100vh - 110px); position: relative; overflow: hidden; background-image: radial-gradient(var(--border-color) 1px, transparent 1px); background-size: 30px 30px; border-radius: 20px; border: 1px solid var(--border-color);">
                <!-- Draggable components will be placed here -->
                <div id="playgroundCanvas" style="width: 100%; height: 100%; position: relative;"></div>
                
                <!-- Plugin Builder Toolbar -->
                <div style="position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 100;">
                    <button class="btn-primary" onclick="showBuilderSettings()" style="background: var(--uiv-color-primary, #6366f1); border-radius: 12px; height: 40px; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center;" title="Plugin Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button class="btn-primary" onclick="showPropertyDefModal()" style="background: var(--uiv-color-primary, #6366f1); border-radius: 12px; height: 40px; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center;" title="Define Properties">
                        <i class="fas fa-list-alt"></i>
                    </button>
                    <button class="btn-primary" onclick="showCode()" style="background: var(--uiv-color-primary, #6366f1); border-radius: 12px; height: 40px; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center;" title="Edit Logic">
                        <i class="fas fa-code"></i>
                    </button>
                    <button class="btn-primary" onclick="saveComposition()" style="background: var(--uiv-status-success, #10b981); padding: 0 20px;">
                        <i class="fas fa-save" style="margin-right: 8px;"></i> Save as Plugin
                    </button>
                </div>

                <!-- Builder Settings Panel (Floating) -->
                <div id="builderSettingsPanel" style="display: none; position: absolute; top: 70px; right: 20px; width: 320px; background: var(--header-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; backdrop-filter: var(--glass-blur); z-index: 101; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
                    <h4 style="margin: 0 0 1rem 0;">Plugin Metadata</h4>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <div>
                            <label style="display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px;">Plugin Name</label>
                            <input type="text" id="builderPluginName" placeholder="My Awesome Plugin" style="width: 100%; height: 40px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); padding: 0 12px;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px;">Selector</label>
                            <input type="text" id="builderPluginSelector" placeholder="my-awesome-plugin" style="width: 100%; height: 40px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); padding: 0 12px;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px;">Description</label>
                            <textarea id="builderPluginDesc" placeholder="A composite plugin built with Playground." style="width: 100%; height: 80px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); padding: 8px 12px; resize: none;"></textarea>
                        </div>
                        <button class="btn-primary" onclick="document.getElementById('builderSettingsPanel').style.display='none'" style="width: 100%; margin-top: 8px;">Done</button>
                    </div>
                </div>

                <!-- Property Definition Panel (Floating) -->
                <div id="propertyDefPanel" style="display: none; position: absolute; top: 70px; right: 20px; width: 360px; background: var(--header-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; backdrop-filter: var(--glass-blur); z-index: 101; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h4 style="margin: 0;">Define Component API</h4>
                        <button onclick="document.getElementById('propertyDefPanel').style.display='none'" style="background: none; border: none; color: var(--text-muted); cursor: pointer;"><i class="fas fa-times"></i></button>
                    </div>

                    <div id="propertyList" style="max-height: 200px; overflow-y: auto; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 8px;">
                        <!-- Property items will appear here -->
                        <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 20px;">No custom properties defined yet.</div>
                    </div>

                    <div style="background: var(--bg-color); border-radius: 12px; padding: 12px; border: 1px solid var(--border-color);">
                        <h5 style="margin: 0 0 10px 0; font-size: 0.8rem;">Add New Property</h5>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <input type="text" id="newPropName" placeholder="Name (e.g. title)" style="width: 100%; height: 36px; background: var(--header-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); padding: 0 10px; font-size: 0.8rem;">
                            <div style="display: flex; gap: 8px;">
                                <select id="newPropType" style="flex: 1; height: 36px; background: var(--header-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); padding: 0 8px; font-size: 0.8rem;">
                                    <option value="string">String</option>
                                    <option value="number">Number</option>
                                    <option value="boolean">Boolean</option>
                                    <option value="object">Object</option>
                                </select>
                                <button class="btn-primary" onclick="addPropertyFromUI()" style="height: 36px; padding: 0 15px; font-size: 0.8rem;">Add</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Custom Script Status -->
            </div>

            <div id="codeView" style="display: none; height: calc(100vh - 110px); flex-direction: column;">
                <div style="padding: 10px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button class="btn-primary" onclick="showPlayground()" style="background: none; border: 1px solid var(--border-color); color: var(--text-primary); width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 10px;" title="Back to Playground">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <h4 style="margin: 0; font-size: 0.9rem;">Component Logic Builder</h4>
                    </div>
                </div>
                <div style="flex-grow: 1; border-radius: 20px; overflow: hidden; border: 1px solid var(--border-color);">
                    <zero-code-editor id="globalCodeEditor" language="javascript" theme="dark"></zero-code-editor>
                </div>
                <div style="margin-top: 1rem; display: flex; justify-content: flex-end; gap: 1rem;">
                    <button class="btn-primary" onclick="applyGlobalCode()" style="background: var(--uiv-status-success, #10b981);">
                        <i class="fas fa-play"></i> Apply & Run Changes
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/packages/register-plugins/index.js"></script>
    <script type="module" src="/packages/zero-theme-orchestrator/src/index.ts"></script>
    <script type="module" src="/packages/zero-uiv-themes/src/index.ts"></script>
    <script type="module" src="/packages/zero-standard-themes/src/index.ts"></script>
    <script type="module" src="./index.ts"></script>
    <script>
        // Inline layout functions removed (moved to index.ts)
    </script>
</body>

</html>
